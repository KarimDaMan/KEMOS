<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEM Debian GNOME</title><script src="./serviceWorker.js"></script><script src="https://cxrtnc.leaningtech.com/1.2.8/cx.js"></script><style>html,body{margin:0;width:100%;height:100%;background:#050607;color:#fff;font-family:system-ui;overflow:hidden}body{display:grid;grid-template-rows:52px 1fr 32px}header,footer{display:flex;align-items:center;gap:10px;padding:0 12px;background:#111318;border-color:#252831}header{border-bottom:1px solid #252831}footer{border-top:1px solid #252831;font-size:12px;color:#aaa}.spacer{flex:1}button{background:#222732;color:#fff;border:1px solid #343a47;border-radius:8px;padding:8px 12px;font-weight:600}#boot{background:#4d63ff}.stage{position:relative;min-width:0;min-height:0;background:#000}canvas{width:100%;height:100%;display:block}.splash{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,#18204c 0,transparent 40%),#08090c}.card{width:min(620px,calc(100% - 40px));background:#141820;border:1px solid #2b303b;border-radius:18px;padding:24px}.card h1{margin:0 0 8px;font-size:38px}.card p{color:#b6bdc9;line-height:1.5}#log{margin-top:14px;font:12px/1.4 monospace;color:#9da6b4;white-space:pre-wrap}.hidden{display:none}</style></head><body><header><strong>KEM Debian GNOME</strong><span>browser VM</span><span class="spacer"></span><button id="boot">Boot</button><button id="reset">Reset</button><button id="full">Fullscreen</button></header><div class="stage" id="stage"><canvas id="display"></canvas><div class="splash" id="splash"><div class="card"><h1>Debian + GNOME in Chrome</h1><p>Real Debian userspace running client-side with a GNOME Flashback desktop. Changes persist in this browser profile.</p><div id="log">Ready.</div></div></div></div><footer><span id="status">not started</span><span class="spacer"></span><span>isolated from ChromeOS</span></footer><script type="module">const $=s=>document.querySelector(s),canvas=$('#display'),stage=$('#stage'),splash=$('#splash'),log=$('#log'),status=$('#status'),boot=$('#boot');let cx=null,overlayStore=null;function note(t){log.textContent+='\n'+t}function fit(){if(!cx)return;const r=stage.getBoundingClientRect();cx.setKmsCanvas(canvas,Math.max(1024,r.width|0),Math.max(768,r.height|0))}new ResizeObserver(fit).observe(stage);async function start(){if(cx)return;boot.disabled=true;try{status.textContent='booting';if(!window.crossOriginIsolated)throw new Error('Reload once so the service worker can enable cross-origin isolation.');const base=await CheerpX.GitHubDevice.create('./debian-gnome.ext2');overlayStore=await CheerpX.IDBDevice.create('kem-debian-gnome-v1');const root=await CheerpX.OverlayDevice.create(base,overlayStore);cx=await CheerpX.Linux.create({mounts:[{type:'ext2',dev:root,path:'/'},{type:'devs',path:'/dev'},{type:'devpts',path:'/dev/pts'},{type:'proc',path:'/proc'},{type:'sys',path:'/sys'}]});fit();splash.classList.add('hidden');status.textContent='running';await cx.run('/usr/local/bin/start-desktop',[],{uid:0,gid:0,env:['HOME=/root','USER=root','SHELL=/bin/bash','LANG=C.UTF-8','LC_ALL=C.UTF-8']});}catch(e){note('ERROR: '+e);status.textContent='failed';boot.disabled=false}}boot.onclick=start;$('#reset').onclick=async()=>{if(overlayStore)await overlayStore.reset();location.reload()};$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen();</script></body></html>
